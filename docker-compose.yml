services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wondercraft:latest
    container_name: wondercraft
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3050}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
