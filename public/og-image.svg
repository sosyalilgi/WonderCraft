<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glowing spheres -->
  <circle cx="200" cy="150" r="180" fill="#4338CA" opacity="0.4" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#BE185D" opacity="0.35" filter="url(#glow)" />
  <circle cx="650" cy="200" r="140" fill="#7C3AED" opacity="0.3" filter="url(#glow)" />

  <!-- Grid decoration lines -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 100)">
    <!-- Brand Badge -->
    <rect width="210" height="42" rx="21" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <circle cx="26" cy="21" r="7" fill="#10B981" />
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">AI COLORING STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      WonderCraft
    </text>
    
    <!-- Gradient Subtitle / Tagline -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="url(#accent)">
      Children's Coloring Book Generator
    </text>

    <!-- Description -->
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      Create personalized storybook coloring pages with custom themes,
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      clean black-and-white outlines, interactive coloring canvas, &amp; PDF export.
    </text>

    <!-- Badges / Feature pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
      <text x="18" y="26" font-family="sans-serif" font-size="15" font-weight="600" fill="#C7D2FE">🎨 Interactive Canvas</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="155" height="42" rx="10" fill="rgba(236, 72, 153, 0.2)" stroke="#EC4899" stroke-width="1" />
      <text x="198" y="26" font-family="sans-serif" font-size="15" font-weight="600" fill="#FBCFE8">📄 Export to PDF</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="160" height="42" rx="10" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1" />
      <text x="368" y="26" font-family="sans-serif" font-size="15" font-weight="600" fill="#FDE68A">✨ 1-Click AI Themes</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(760, 90)" filter="url(#shadow)">
    <!-- Canvas Card Frame -->
    <rect width="360" height="450" rx="24" fill="#FFFFFF" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    
    <!-- Top Card Header -->
    <rect width="360" height="50" rx="24" fill="#F8FAFC" />
    <rect y="30" width="360" height="20" fill="#F8FAFC" />
    <circle cx="28" cy="25" r="6" fill="#EF4444" />
    <circle cx="46" cy="25" r="6" fill="#F59E0B" />
    <circle cx="64" cy="25" r="6" fill="#10B981" />
    <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Storybook Page 1</text>

    <!-- Coloring Sheet Illustration Mockup -->
    <g transform="translate(30, 75)">
      <!-- Sheet background -->
      <rect width="300" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4" />
      
      <!-- Cheerful Dragon / Dinosaur Outline drawing -->
      <!-- Hill -->
      <path d="M 10 320 Q 150 250 290 320 Z" fill="#BBF7D0" stroke="#1E293B" stroke-width="3" />
      <!-- Sun -->
      <circle cx="60" cy="50" r="28" fill="#FDE047" stroke="#1E293B" stroke-width="3" />
      <!-- Clouds -->
      <path d="M 200 45 Q 215 30 235 40 Q 255 35 265 50 Q 255 65 200 65 Z" fill="#E0F2FE" stroke="#1E293B" stroke-width="2" />
      <!-- Character / Castle -->
      <path d="M 110 260 L 110 180 L 130 180 L 130 150 L 170 150 L 170 180 L 190 180 L 190 260 Z" fill="#DDD6FE" stroke="#1E293B" stroke-width="3" />
      <polygon points="120,150 150,110 180,150" fill="#F43F5E" stroke="#1E293B" stroke-width="3" />
      <!-- Door -->
      <rect x="135" y="210" width="30" height="50" rx="15" fill="#FED7AA" stroke="#1E293B" stroke-width="3" />
      <!-- Castle Windows -->
      <circle cx="150" cy="180" r="8" fill="#FEF08A" stroke="#1E293B" stroke-width="2" />
      
      <!-- Color Palette swatches bar inside card -->
      <g transform="translate(25, 295)">
        <circle cx="20" cy="15" r="12" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="55" cy="15" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="90" cy="15" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="125" cy="15" r="12" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="160" cy="15" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="195" cy="15" r="12" fill="#EC4899" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="230" cy="15" r="12" fill="#1E293B" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
